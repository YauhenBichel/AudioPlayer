name: Contributors

# The wall lives in readme-contributors as a reusable workflow. This file used
# to be a copy of it, carrying a `git add` that named files this repository
# does not have, so the step died at exit 128 before it could commit.

on:
  schedule:
    - cron: "17 4 * * 0"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  wall:
    uses: YauhenBichel/readme-contributors/.github/workflows/wall.yml@v1
    secrets: inherit
